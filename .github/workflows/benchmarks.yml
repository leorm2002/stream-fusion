name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile benchmarks
        run: sbt -batch 'benchmarks / Jmh / compile'

      - name: Run benchmarks
        run: |
          sbt -batch "benchmarks / Jmh / run -foe true -rf json -rff \"${GITHUB_WORKSPACE}/benchmarks/target/jmh-results.json\" .*Benchmark.*"

      - name: Publish JSON results
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results-${{ github.sha }}-${{ github.run_attempt }}
          path: benchmarks/target/jmh-results.json
          if-no-files-found: error
          retention-days: 30
