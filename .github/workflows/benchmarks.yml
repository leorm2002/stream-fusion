name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      results_artifact_id: ${{ steps.results.outputs.artifact-id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile benchmarks
        run: sbt -batch 'benchmarks / Jmh / compile'

      - name: Run benchmarks
        run: |
          sbt -batch "benchmarks / Jmh / run -foe true -rf json -rff \"${GITHUB_WORKSPACE}/benchmarks/target/jmh-results.json\" .*Benchmark.*"

      - name: Publish JSON results
        id: results
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results-${{ github.sha }}-${{ github.run_attempt }}
          path: benchmarks/target/jmh-results.json
          if-no-files-found: error
          retention-days: 30

  publish-pages:
    needs: benchmarks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.benchmarks.outputs.results_artifact_id }}
          path: ${{ runner.temp }}/jmh-results
          merge-multiple: true

      - name: Prepare benchmark history
        run: |
          history_ref="$(git ls-remote --heads origin refs/heads/gh-pages)"
          if [ -n "$history_ref" ]; then
            git fetch origin gh-pages:gh-pages
          else
            git switch --orphan gh-pages
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --allow-empty -m 'Initialize benchmark history'
            git checkout -
          fi

      - name: Update benchmark charts and history
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Stream Fusion JMH
          tool: jmh
          output-file-path: ${{ runner.temp }}/jmh-results/jmh-results.json
          ref: ${{ github.sha }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: .
          skip-fetch-gh-pages: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          comment-always: false
          comment-on-alert: false
          fail-on-alert: false

      - name: Prepare Pages content
        run: |
          mkdir -p "$RUNNER_TEMP/benchmark-site"
          git archive gh-pages | tar -x -C "$RUNNER_TEMP/benchmark-site"
          cp "$RUNNER_TEMP/jmh-results/jmh-results.json" "$RUNNER_TEMP/benchmark-site/jmh-results.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/benchmark-site

      - name: Deploy benchmark dashboard
        id: deployment
        uses: actions/deploy-pages@v5
